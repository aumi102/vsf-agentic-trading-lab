<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VSF QuestDB Agent — Demo Console</title>
<style>
  :root {
    --bg:#0f1419; --panel:#1a2027; --panel2:#222b34; --ink:#e6edf3; --muted:#9aa7b4;
    --accent:#4da3ff; --ok:#3fb950; --warn:#d29922; --fail:#f85149; --line:#2d3742;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex;
           align-items:center; gap:16px; flex-wrap:wrap; background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  header .sub { color:var(--muted); font-size:12px; }
  .modepick { margin-left:auto; display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted); }
  select, input, button { font-family:inherit; }
  .wrap { display:grid; grid-template-columns:300px 1fr; gap:0; height:calc(100vh - 56px); }
  .menu { border-right:1px solid var(--line); overflow:auto; padding:12px; background:var(--panel); }
  .group-title { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em;
                 margin:14px 6px 6px; }
  button.item { display:block; width:100%; text-align:left; background:var(--panel2); color:var(--ink);
                border:1px solid var(--line); border-radius:8px; padding:9px 11px; margin:6px 0; cursor:pointer; }
  button.item:hover { border-color:var(--accent); }
  button.item .desc { color:var(--muted); font-size:11px; margin-top:3px; }
  .ask { margin-top:16px; padding-top:12px; border-top:1px solid var(--line); }
  .ask textarea { width:100%; height:60px; background:var(--panel2); color:var(--ink); border:1px solid var(--line);
                  border-radius:8px; padding:8px; resize:vertical; }
  .ask .row { display:flex; gap:8px; margin-top:6px; align-items:center; }
  .ask button { background:var(--accent); color:#05121f; border:none; border-radius:8px; padding:8px 14px; cursor:pointer; font-weight:600; }
  .main { overflow:auto; padding:18px 22px; }
  .placeholder { color:var(--muted); margin-top:40px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px; }
  .card h2 { font-size:13px; margin:0 0 10px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .badge { display:inline-block; padding:2px 8px; border-radius:20px; font-size:12px; font-weight:600; }
  .b-ok{ background:rgba(63,185,80,.16); color:var(--ok);} .b-warn{ background:rgba(210,153,34,.16); color:var(--warn);}
  .b-fail{ background:rgba(248,81,73,.16); color:var(--fail);} .b-neutral{ background:rgba(77,163,255,.16); color:var(--accent);}
  .pipeline { display:flex; flex-wrap:wrap; gap:4px; margin:8px 0; }
  .step { padding:3px 9px; border-radius:6px; background:var(--panel2); color:var(--muted); font-size:11px; border:1px solid var(--line); }
  .step.active { background:var(--accent); color:#05121f; font-weight:700; border-color:var(--accent); }
  .agent { border-left:3px solid var(--accent); padding:8px 12px; margin:8px 0; background:var(--panel2); border-radius:0 8px 8px 0; }
  .agent .name { font-weight:600; } .agent .role { color:var(--muted); font-size:12px; }
  .agent .reason { margin-top:5px; } .kv { color:var(--muted); font-size:12px; margin-top:4px; }
  .tool { font-family:ui-monospace,Consolas,monospace; font-size:12px; background:var(--panel2); border:1px solid var(--line);
          border-radius:6px; padding:2px 6px; margin:2px 4px 2px 0; display:inline-block; }
  .reject { color:var(--fail); }
  table { border-collapse:collapse; width:100%; font-size:12.5px; }
  th,td { border:1px solid var(--line); padding:5px 8px; text-align:left; } th { color:var(--muted); background:var(--panel2); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  pre { background:#0b0f14; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font-size:12px; max-height:340px; }
  .md { line-height:1.5; } .md code { background:var(--panel2); padding:1px 5px; border-radius:4px; }
  .caveat { color:var(--warn); font-size:12.5px; margin:3px 0; } .caveat::before { content:"⚠ "; }
  .next { border:1px dashed var(--accent); border-radius:8px; padding:10px 12px; }
  .next .cmd { font-family:ui-monospace,Consolas,monospace; background:#0b0f14; padding:6px 8px; border-radius:6px; display:block; margin-top:6px; }
  .timing { color:var(--muted); font-size:12px; } .spin { color:var(--accent); }
  a { color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>VSF QuestDB Agent · Demo Console</h1>
  <span class="sub" id="svc">read-only · anti-blackbox</span>
  <div class="modepick">
    query mode:
    <select id="mode"><option value="rest">REST (9000)</option><option value="pgwire">PGWire (8812)</option></select>
  </div>
</header>
<div class="wrap">
  <nav class="menu" id="menu">
    <div class="placeholder">loading menu…</div>
    <div class="ask">
      <div class="group-title">Ask the agent</div>
      <textarea id="askbox" placeholder="Ask: FPT signal, run FPT backtest, data status"></textarea>
      <div class="row">
        <select id="askmode"><option value="rule">rule</option><option value="deep">deep (LLM)</option></select>
        <button onclick="ask()">Ask</button>
      </div>
    </div>
  </nav>
  <main class="main" id="main">
    <div class="placeholder">Pick an action on the left. Each result shows the pipeline position, the agent that handled it, its decision and reason, the tools used, caveats, and the next recommended action.</div>
  </main>
</div>
<script>
const PATH = ["source","raw","bronze","silver","gold","signal","backtest","validation","agent_answer"];
const $ = (id) => document.getElementById(id);
function badge(s){ s=(s||"").toString().toUpperCase();
  const c = s==="OK"||s==="PASS" ? "b-ok" : s==="WARN"||s==="PARTIAL"||s==="UNAVAILABLE" ? "b-warn"
          : s==="FAIL"||s==="ERROR"||s==="UNSUPPORTED" ? "b-fail" : "b-neutral";
  return `<span class="badge ${c}">${s||"?"}</span>`; }
function esc(x){ return (x==null?"":String(x)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function mdToHtml(md){ if(!md) return "";
  return esc(md).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }

async function load(){
  try {
    const m = await (await fetch('/api/demo/menu')).json();
    $('svc').textContent = `${m.service} · pgwire ${m.pgwire_available?'available':'off'}`;
    if(!m.pgwire_available){ $('mode').querySelector('[value=pgwire]').disabled = true; }
    const groups = {};
    m.menu.forEach(it => { (groups[it.group] ||= []).push(it); });
    let html = "";
    for(const g in groups){
      html += `<div class="group-title">${esc(g)}</div>`;
      groups[g].forEach(it => {
        html += `<button class="item" onclick="run('${it.path}','${it.id}')">${esc(it.label)}<div class="desc">${esc(it.description)}</div></button>`;
      });
    }
    $('menu').insertAdjacentHTML('afterbegin', html);
    $('menu').querySelector('.placeholder')?.remove();
  } catch(e){ $('menu').innerHTML = `<div class="placeholder">menu failed: ${esc(e.message)}</div>`; }
}
function withMode(path){ const mode=$('mode').value; return path + (path.includes('?')?'&':'?') + 'mode=' + mode; }
async function run(path, id){
  $('main').innerHTML = `<div class="placeholder spin">running ${esc(path)} …</div>`;
  try {
    const data = await (await fetch(withMode(path))).json();
    $('main').innerHTML = render(id, data);
  } catch(e){ $('main').innerHTML = `<div class="card">request failed: ${esc(e.message)}</div>`; }
}
async function ask(){
  const message = $('askbox').value.trim(); if(!message) return;
  $('main').innerHTML = `<div class="placeholder spin">asking…</div>`;
  try {
    const data = await (await fetch('/api/demo/ask', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message, mode:$('askmode').value, query_mode:$('mode').value})})).json();
    $('main').innerHTML = render('ask', data);
  } catch(e){ $('main').innerHTML = `<div class="card">ask failed: ${esc(e.message)}</div>`; }
}

function render(id, d){
  if(d && d.status==='error' && d.error_type) return renderError(d);
  if(d.menu) return "<div class='card'>menu</div>";
  if(d.usable_now) return renderProductOverview(d);
  if(d.daily_prices_rows!==undefined) return renderProductDataStatus(d);
  if(d.approved_only?.approved_count!==undefined) return renderProductAdjustedGate(d);
  if(d.signals!==undefined && !d.trace) return renderProductSignals(d);
  if(d.engine==='custom_backtest_v1') return renderProductBacktest(d);
  if(d.commission_bps!==undefined && d.price_band_guard) return renderProductCostSlippage(d);
  if(d.approved_adjusted_OHLC_blocked!==undefined) return renderProductSourceVerification(d);
  if(d.decision && d.inputs) return renderProductDecision(d);
  if(d.gates) return renderValidation(d);
  if(d.checks) return renderReadiness(d);
  if(d.results && d.recommendation_mode!==undefined) return renderBenchmark(d);
  if(d.examples) return renderTraceExamples(d);
  if(d.next_actions && !d.trace) return renderNextActions(d);
  if(d.questdb_health) return renderStatus(d);
  if(d.variants) return renderVariants(d);
  return renderEnvelope(d); // market/fa/backtest/slippage/events/ask/simple-engine(+logic)
}
function renderProductOverview(d){
  let html = `<div class="card"><h2>Product Overview · ${badge(d.status)}</h2>`;
  html += `<div class="group-title">Usable Now</div><ul>`;
  (d.usable_now||[]).forEach(x=>html+=`<li>${esc(x)}</li>`);
  html += `</ul><div class="group-title">Not Yet Production</div><ul>`;
  (d.not_yet_production||[]).forEach(x=>html+=`<li class="caveat">${esc(x)}</li>`);
  html += `</ul><div class="kv">${esc(d.main_run_mode||'')}</div></div>`;
  return html;
}
function renderProductDataStatus(d){
  let html = `<div class="card"><h2>QuestDB Data Status · ${badge(d.status)}</h2><table><tr><th>table</th><th>rows</th></tr>`;
  html += `<tr><td>daily_prices</td><td class="num">${fmt(d.daily_prices_rows||0)}</td></tr>`;
  html += `<tr><td>adjusted_daily_prices</td><td class="num">${fmt(d.adjusted_daily_prices_rows||0)}</td></tr>`;
  html += `<tr><td>event_news_items</td><td class="num">${fmt(d.event_news_items_rows||0)}</td></tr>`;
  (d.fa_ingest_runs||[]).forEach(r=>{html+=`<tr><td>fa_ingest_runs (${r.status})</td><td class="num">${fmt(r.count)}</td></tr>`;});
  html += `</table></div>`;
  return html;
}
function renderProductAdjustedGate(d){
  let html = `<div class="card"><h2>Adjusted OHLC Gate · ${badge(d.status)}</h2>`;
  html += `<div class="group-title">approved_only</div><table><tr><th>symbol</th><th>status</th></tr>`;
  html += `<tr><td>FPT</td><td><span class="badge b-fail">${esc(d.approved_only?.FPT||'BLOCKED')}</span></td></tr>`;
  html += `<tr><td>VNM</td><td><span class="badge b-fail">${esc(d.approved_only?.VNM||'BLOCKED')}</span></td></tr>`;
  html += `<tr><td>HPG/VCB/CTG/VHM</td><td><span class="badge b-fail">${esc(d.approved_only?.HPG_VCB_CTG_VHM||'BLOCKED')}</span></td></tr>`;
  html += `</table><div class="kv">approved_count: ${d.approved_only?.approved_count||0} · official_backtest: ${d.approved_only?.official_backtest_allowed?'YES':'NO'}</div>`;
  html += `<div class="group-title">prototype_allowed (vnstock)</div>`;
  if(d.prototype_allowed?.symbols?.length){ html+=`<table><tr><th>symbol</th><th>status</th><th>rows</th><th>date range</th><th>source</th></tr>`;
    d.prototype_allowed.symbols.forEach(s=>{
      html+=`<tr><td>${esc(s.symbol)}</td><td><span class="badge b-ok">${esc(s.status||'PASS')}</span></td><td class="num">${fmt(s.rows)}</td><td>${esc(s.date_min||'')} .. ${esc(s.date_max||'')}</td><td><code>${esc(s.adjustment_source||'')}</code></td></tr>`;});
    html+=`</table>`;} else { html+=`<div class="kv">no prototype data</div>`; }
  (d.warnings||[]).forEach(w=>html+=`<div class="caveat">${esc(w)}</div>`);
  return html;
}
function renderProductSignals(d){
  let html = `<div class="card"><h2>Strategy Signals · ${badge(d.status)}</h2>`;
  html += `<div class="kv">strategy: ${esc(d.strategy||'')} · source: ${esc(d.source_policy||'')} · basis: ${esc(d.data_basis||'')}</div>`;
  if(d.signals?.length){ html += `<table><tr><th>symbol</th><th>signal</th><th>raw</th><th>position</th><th>score</th><th>reason</th></tr>`;
    d.signals.forEach(s=>{const sig=esc(s.signal||'');const c=sig==='BUY'?'b-ok':sig==='SELL'?'b-fail':'b-warn';
      html+=`<tr><td>${esc(s.symbol)}</td><td><span class="badge ${c}">${sig}</span></td><td>${esc(s.raw_signal||'-')}</td><td>${esc(s.position_state||'-')}</td><td class="num">${fmt(s.score)}</td><td>${esc(s.reason||'')}</td></tr>`;});
    html+=`</table>`;}
  (d.warnings||[]).forEach(w=>html+=`<div class="caveat">${esc(w)}</div>`);
  return html;
}
function renderProductBacktest(d){
  let html = `<div class="card"><h2>Backtest Engine v1 · ${badge(d.status)}</h2>`;
  html += `<div class="kv">engine: ${esc(d.engine||'')} · strategy: ${esc(d.strategy||'')} · policy: ${esc(d.source_policy||'')}</div>`;
  if(d.results?.length){ d.results.forEach(r=>{
    if(r.status==='error'){html+=`<div class="kv caveat">${esc(r.symbol)}: ${esc(r.error||'')}</div>`;return;}
    html+=`<div class="group-title">${esc(r.symbol)}</div>`;
    // Backtest Setup
    html+=`<div class="group-title">Backtest Setup</div><table>`;
    const dl=r.data_lineage||{};
    html+=`<tr><td>symbol</td><td>${esc(r.symbol)}</td></tr>`;
    html+=`<tr><td>strategy</td><td><code>${esc(d.strategy||'')}</code></td></tr>`;
    html+=`<tr><td>date_range</td><td>${esc(dl.date_range||d.date_range||'')}</td></tr>`;
    html+=`<tr><td>data_basis</td><td><code>${esc(dl.data_basis||'')}</code></td></tr>`;
    html+=`<tr><td>adjustment_source</td><td><code>${esc(dl.adjustment_source||'')}</code></td></tr>`;
    html+=`<tr><td>price_basis</td><td>${esc(dl.price_basis||'')}</td></tr>`;
    html+=`<tr><td>commission_bps</td><td class="num">${dl.commission_bps||d.commission_bps||0}</td></tr>`;
    html+=`<tr><td>slippage_bps</td><td class="num">${dl.slippage_bps||d.slippage_bps||0}</td></tr>`;
    html+=`</table>`;
    // Strategy Logic
    const sl=r.strategy_logic||{};
    html+=`<div class="group-title">Strategy Logic</div><table>`;
    html+=`<tr><td>rule</td><td>${esc(sl.rule||'')}</td></tr>`;
    html+=`<tr><td>buy_condition</td><td>${esc(sl.buy_condition||'')}</td></tr>`;
    html+=`<tr><td>sell_condition</td><td>${esc(sl.sell_condition||'')}</td></tr>`;
    html+=`<tr><td>signal_timing</td><td>${esc(sl.signal_timing||'')}</td></tr>`;
    html+=`</table>`;
    // Trade Summary
    const ts=r.trade_summary||{};
    html+=`<div class="group-title">Trade Summary</div><table>`;
    html+=`<tr><td>total_trades</td><td class="num">${fmt(ts.total_trades)}</td></tr>`;
    html+=`<tr><td>closed_trades</td><td class="num">${fmt(ts.closed_trades)}</td></tr>`;
    if(ts.why_no_trades){html+=`<tr><td colspan="2" class="caveat">${esc(ts.why_no_trades)}</td></tr>`;}
    html+=`</table>`;
    // Metrics
    const m=r.metrics||{};
    html+=`<div class="group-title">Metrics</div><table><tr><th>metric</th><th>value</th></tr>`;
    html+=`<tr><td>total_return_pct</td><td class="num">${fmt(m.total_return_pct)}</td></tr>`;
    html+=`<tr><td>sharpe_ratio</td><td class="num">${fmt(m.sharpe_ratio)}</td></tr>`;
    html+=`<tr><td>sortino_ratio</td><td class="num">${fmt(m.sortino_ratio)}</td></tr>`;
    html+=`<tr><td>profit_factor</td><td class="num">${fmt(m.profit_factor)}</td></tr>`;
    html+=`<tr><td>max_drawdown_pct</td><td class="num">${fmt(m.max_drawdown_pct)}</td></tr>`;
    html+=`<tr><td>win_rate</td><td class="num">${fmt(m.win_rate)}</td></tr>`;
    html+=`<tr><td>total_commission</td><td class="num">${fmt(m.total_commission)}</td></tr>`;
    html+=`<tr><td>total_slippage_estimate</td><td class="num">${fmt(m.total_slippage_estimate)}</td></tr>`;
    html+=`</table>`;
  });}
  (d.warnings||[]).forEach(w=>html+=`<div class="caveat">${esc(w)}</div>`);
  html+=`<div class="kv">⚠ prototype only: vnstock-derived adjusted rows, not approved. Not investment advice.</div>`;
  return html;
}
function renderProductDecision(d){
  // Signal is a strategy input. Decision is the agent's final research conclusion.
  let html = `<div class="card"><h2>Symbol Decision · ${esc(d.symbol||'')} · ${badge(d.status)}</h2>`;
  html += `<div class="kv">Signal is a strategy input. Decision is the agent's final research conclusion after checking adjusted source, data quality, backtest/risk caveats.</div>`;
  html += `<div class="kv">strategy: <code>${esc(d.strategy||'')}</code> · source_policy: <code>${esc(d.source_policy||'')}</code></div>`;

  // Final Decision
  const dec = d.decision || {};
  const decBadge = (a) => {
    if(!a) return "b-neutral";
    const x = a.toUpperCase();
    if(x==="BUY_CANDIDATE") return "b-ok";
    if(x==="HOLD" || x==="NO_POSITION") return "b-warn";
    if(x==="SELL_OR_EXIT") return "b-fail";
    if(x==="NO_OFFICIAL_ACTION" || x==="UNANSWERED") return "b-fail";
    return "b-neutral";
  };
  html += `<div class="group-title">Final Decision</div><table><tr><th>field</th><th>value</th></tr>`;
  html += `<tr><td>action</td><td><span class="badge ${decBadge(dec.action)}">${esc(dec.action||'')}</span></td></tr>`;
  html += `<tr><td>confidence</td><td>${badge(dec.confidence||'')}</td></tr>`;
  html += `<tr><td>reason</td><td>${esc(dec.reason||'')}</td></tr>`;
  html += `<tr><td>why different from signal</td><td class="caveat">${esc(dec.why_different_from_signal||'')}</td></tr>`;
  html += `<tr><td>is_investment_advice</td><td><span class="badge b-warn">${dec.is_investment_advice===false?'no':'yes'}</span></td></tr>`;
  html += `</table></div>`;

  // Signal Input
  const sig = (d.inputs && d.inputs.signal) || {};
  html += `<div class="card"><h2>Signal Input</h2><table><tr><th>field</th><th>value</th></tr>`;
  html += `<tr><td>raw_signal</td><td>${esc(sig.raw_signal||'-')}</td></tr>`;
  html += `<tr><td>display_signal</td><td>${esc(sig.display_signal||'-')}</td></tr>`;
  html += `<tr><td>strategy</td><td><code>${esc(sig.strategy||'')}</code></td></tr>`;
  html += `<tr><td>score</td><td class="num">${fmt(sig.score)}</td></tr>`;
  html += `<tr><td>reason_code</td><td><code>${esc(sig.reason_code||'')}</code></td></tr>`;
  html += `</table></div>`;

  // Adjusted Source Status
  const ag = (d.inputs && d.inputs.adjusted_gate) || {};
  html += `<div class="card"><h2>Adjusted Source Status · ${badge(ag.status||'')}</h2><table><tr><th>field</th><th>value</th></tr>`;
  html += `<tr><td>approved</td><td>${ag.approved?'<span class="badge b-ok">yes</span>':'<span class="badge b-fail">no</span>'}</td></tr>`;
  html += `<tr><td>prototype</td><td>${ag.prototype?'<span class="badge b-warn">yes</span>':'<span class="badge b-warn">no</span>'}</td></tr>`;
  html += `<tr><td>approved_count</td><td class="num">${fmt(ag.approved_count||0)}</td></tr>`;
  html += `<tr><td>prototype_rows</td><td class="num">${fmt(ag.prototype_rows||0)}</td></tr>`;
  html += `<tr><td>source_status</td><td>${esc(ag.source_status||'')}</td></tr>`;
  html += `<tr><td>data_basis</td><td><code>${esc(ag.data_basis||'')}</code></td></tr>`;
  if(ag.approved===false && d.source_policy==='approved_only'){
    html += `<tr><td colspan="2" class="caveat">approved_only blocks official action until approved corporate-action/vendor adjusted source exists</td></tr>`;
  }
  html += `</table></div>`;

  // Backtest Summary
  const bt = (d.inputs && d.inputs.backtest_summary) || {};
  html += `<div class="card"><h2>Backtest Summary</h2><table><tr><th>field</th><th>value</th></tr>`;
  html += `<tr><td>available</td><td>${bt.available?'<span class="badge b-ok">yes</span>':'<span class="badge b-warn">no</span>'}</td></tr>`;
  html += `<tr><td>total_return_pct</td><td class="num">${fmt(bt.total_return_pct)}</td></tr>`;
  html += `<tr><td>sharpe_ratio</td><td class="num">${fmt(bt.sharpe_ratio)}</td></tr>`;
  html += `<tr><td>max_drawdown_pct</td><td class="num">${fmt(bt.max_drawdown_pct)}</td></tr>`;
  html += `<tr><td>trade_count</td><td class="num">${fmt(bt.trade_count)}</td></tr>`;
  html += `<tr><td>data_basis</td><td><code>${esc(bt.data_basis||'')}</code></td></tr>`;
  html += `<tr><td>adjustment_source</td><td><code>${esc(bt.adjustment_source||'')}</code></td></tr>`;
  html += `</table></div>`;

  // Caveats
  html += caveatsCard(d.caveats);
  html += `<div class="card"><h2>Guardrails</h2>`;
  if(d.source_policy==='prototype_allowed') html += `<div class="caveat">prototype only: vnstock-derived adjusted rows are prototype only, not approved</div>`;
  if(d.source_policy==='prototype_allowed') html += `<div class="caveat">vnstock-derived adjusted rows are prototype only, not approved</div>`;
  if(d.source_policy==='approved_only') html += `<div class="caveat">approved_only remains blocked until approved corporate action/vendor adjusted source exists</div>`;
  html += `<div class="caveat">This is research output only, not investment advice.</div>`;
  html += `</div>`;
  return html;
}
function renderProductCostSlippage(d){
  let html = `<div class="card"><h2>Cost & Slippage Guard · ${badge(d.status)}</h2><table><tr><th>param</th><th>value</th></tr>`;
  html+=`<tr><td>commission_bps</td><td class="num">${d.commission_bps}</td></tr>`;
  html+=`<tr><td>slippage_bps</td><td class="num">${d.slippage_bps}</td></tr>`;
  for(const [k,v] of Object.entries(d.price_band_guard||{})){html+=`<tr><td>price band guard ${esc(k)}</td><td class="num">${v} bps</td></tr>`;}
  html+=`</table>`;
  html+=`<div class="group-title">Trade-level Fields</div><ul>`;
  (d.trade_level_fields||[]).forEach(f=>html+=`<li><code>${esc(f)}</code></li>`);
  html+=`</ul></div>`;
  return html;
}
function renderProductSourceVerification(d){
  let html = `<div class="card"><h2>Source Verification · ${badge(d.status)}</h2><table><tr><th>table</th><th>FPT rows</th></tr>`;
  html+=`<tr><td>event_news_items</td><td class="num">${fmt(d.event_news_items_FPT||0)}</td></tr>`;
  html+=`<tr><td>event_news_raw_payloads</td><td class="num">${fmt(d.event_news_raw_payloads_FPT||0)}</td></tr>`;
  html+=`<tr><td>fa_balance_sheet</td><td class="num">${fmt(d.fa_balance_sheet_FPT||0)}</td></tr></table>`;
  html+=`<div class="kv">FPT PDF scanned: ${d.FPT_PDF_scanned?'yes':'no'}</div>`;
  html+=`<div class="kv">approved adjusted OHLC blocked: ${d.approved_adjusted_OHLC_blocked?'yes':'no'}</div>`;
  html+=`<div class="kv caveat">next: ${esc(d.next_blocker||'')}</div></div>`;
  return html;
}
function renderLogic(L){
  if(!L) return "";
  const order = ["data_source","date_range","price_input","signal_formula","execution_timing","position_sizing",
    "commission","slippage","fractional_shares","direction","cash_hold_behavior","equity_update","metrics"];
  let rows = order.filter(k=>L[k]!=null).map(k=>`<tr><th>${esc(k.replace(/_/g,' '))}</th><td>${esc(L[k])}</td></tr>`).join("");
  let diffs = (L.why_differs_from_backtrader||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  return `<div class="card"><h2>SimpleEngine logic (exact)</h2><table>${rows}</table>
    ${diffs?`<div class="kv" style="margin-top:8px"><b>why it differs vs Backtrader</b><ul>${diffs}</ul></div>`:''}</div>`;
}
function renderVariants(d){
  let html = `<div class="card"><h2>Strategy logic lab · ${esc(d.action||'')}</h2>${d.answer_markdown?`<div class="md">${mdToHtml(d.answer_markdown)}</div>`:''}
    <table><tr><th>variant</th><th>changed</th><th>total %</th><th>ann %</th><th>max dd %</th><th>sharpe</th><th>trades</th><th>win %</th></tr>`;
  (d.rows||[]).forEach(r=>{ const base = r.variant===d.baseline_id;
    html += `<tr${base?' style="background:rgba(77,163,255,.10)"':''}><td>${esc(r.variant)}</td><td>${esc(r.changed)}</td>
      <td class="num">${fmt(r.total_return_pct)}</td><td class="num">${fmt(r.annualized_return_pct)}</td>
      <td class="num">${fmt(r.max_drawdown_pct)}</td><td class="num">${fmt(r.sharpe)}</td>
      <td class="num">${fmt(r.trades)}</td><td class="num">${fmt(r.win_rate_pct)}</td></tr>`; });
  html += `</table></div><div class="card"><h2>Why each variant differs</h2>`;
  (d.rows||[]).forEach(r=>{ if(r.variant!==d.baseline_id) html += `<div class="kv"><b>${esc(r.variant)}</b>: ${esc(r.narrative||'')}</div>`; });
  html += `</div>` + renderTrace(d.trace) + caveatsCard(d.caveats);
  return html;
}

function renderTrace(t){
  if(!t) return "";
  let html = `<div class="card"><h2>Anti-blackbox pipeline trace</h2>`;
  html += `<div class="kv">request_id <code>${esc(t.request_id)}</code> · domain ${badge(t.domain)}</div>`;
  const cur = t.pipeline_position?.current_step;
  html += `<div class="pipeline">` + PATH.map(s=>`<span class="step ${s===cur?'active':''}">${s}</span>`).join("") + `</div>`;
  html += `<div class="kv">upstream tables: ${(t.pipeline_position?.upstream_tables||[]).map(x=>`<span class="tool">${esc(x)}</span>`).join("")}</div>`;
  (t.agents||[]).forEach(a=>{
    html += `<div class="agent"><div class="name">${esc(a.agent_name)} <span class="role">— ${esc(a.role)}</span></div>`;
    html += `<div class="reason"><b>decision:</b> ${esc(a.decision)}</div>`;
    html += `<div class="reason"><b>why:</b> ${esc(a.reason)}</div>`;
    if(a.allowed_tools?.length) html += `<div class="kv">allowed: ${a.allowed_tools.map(x=>`<span class="tool">${esc(x)}</span>`).join("")}</div>`;
    if(a.rejected_tools?.length) html += `<div class="kv">rejected: ${a.rejected_tools.map(x=>`<span class="tool reject">${esc(x)}</span>`).join("")}</div>`;
    if(a.tool_calls?.length) html += `<div class="kv">tool calls: ${a.tool_calls.map(c=>`<span class="tool">${esc(c.tool)}${c.status?` · ${c.status}`:''}${c.row_count!=null?` · ${c.row_count} rows`:''}</span>`).join("")}</div>`;
    html += `</div>`;
  });
  const b = t.final_answer_basis||{};
  html += `<div class="kv">final basis: source <b>${esc(b.source)}</b> · query_mode <b>${esc(b.query_mode)}</b> · tables ${(b.tables||[]).map(x=>`<span class="tool">${esc(x)}</span>`).join("")}</div>`;
  html += `</div>`;
  return html;
}
function timingLine(d){
  const t = d.timing||{}; const parts=[];
  if(t.query_mode) parts.push(`mode ${esc(t.query_mode)}`);
  if(t.execute_ms!=null) parts.push(`execute ${(+t.execute_ms).toFixed(3)}ms`);
  if(t.total_ms!=null) parts.push(`total ${(+t.total_ms).toFixed(3)}ms`);
  if(d.elapsed_ms!=null) parts.push(`handler ${(+d.elapsed_ms).toFixed(1)}ms`);
  return parts.length ? `<div class="timing">⏱ ${parts.join(" · ")}</div>` : "";
}
function nextActionCard(a){
  if(!a) return "";
  return `<div class="card"><h2>Next recommended action</h2><div class="next"><b>${esc(a.title)}</b> ${badge(a.status)}
    <div class="kv">${esc(a.why)}</div><code class="cmd">${esc(a.command)}</code>
    <div class="kv">UI: ${esc(a.ui_path||'')}</div></div></div>`;
}
function caveatsCard(c){ if(!c||!c.length) return ""; return `<div class="card"><h2>Caveats</h2>${c.map(x=>`<div class="caveat">${esc(x)}</div>`).join("")}</div>`; }

function renderError(d){
  return `<div class="card"><h2>Endpoint error ${badge('error')}</h2>
    <div class="kv"><b>${esc(d.error_type||'Error')}</b>${d.path?` at <code>${esc(d.path)}</code>`:''}</div>
    <pre>${esc(d.message||'')}</pre>
    ${caveatsCard(d.caveats)}
    ${d.next_action?`<div class="next">next: ${esc(typeof d.next_action==='string'?d.next_action:(d.next_action.title||''))}</div>`:''}</div>`;
}
function renderEnvelope(d){
  let html = `<div class="card"><h2>Result · ${esc(d.action||d.domain||'')}</h2>
    <div>status ${badge(d.status)} ${d.mode?`· mode <code>${esc(d.mode)}</code>`:''}</div>${timingLine(d)}`;
  if(d.answer_markdown) html += `<div class="md" style="margin-top:10px">${mdToHtml(d.answer_markdown)}</div>`;
  if(d.rows && Array.isArray(d.rows) && d.rows.length) html += table(d.rows);
  html += `</div>`;
  if(d.logic) html += renderLogic(d.logic);
  html += renderTrace(d.trace);
  html += nextActionCard(d.next_action);
  html += caveatsCard(d.caveats);
  return html;
}
function renderStatus(d){
  const h=d.questdb_health||{}, fa=d.fa_latest_complete_run||{}, bt=d.backtest_summary||{}, pc=d.pipeline_counts||{};
  let html = `<div class="card"><h2>System status</h2><div>status ${badge(d.status)}</div>`;
  html += `<table><tr><th>metric</th><th>value</th></tr>
    <tr><td>daily_prices rows</td><td class="num">${fmt(h.row_count)}</td></tr>
    <tr><td>distinct symbols</td><td class="num">${fmt(h.distinct_symbols)}</td></tr>
    <tr><td>date range</td><td>${esc(h.first_date)} .. ${esc(h.last_date)}</td></tr>
    <tr><td>feature_snapshots / signals</td><td class="num">${fmt(pc.feature_snapshots)} / ${fmt(pc.signals)}</td></tr>
    <tr><td>backtest runs / symbols / strategies</td><td class="num">${fmt(bt.runs)} / ${fmt(bt.symbols)} / ${fmt(bt.strategies)}</td></tr>
    <tr><td>backtest_trades</td><td class="num">${fmt(pc.backtest_trades)}</td></tr>
    <tr><td>FA latest complete run</td><td>${esc(fa.run_id)} · ${fmt(fa.symbols_processed)} symbols · fail ${fmt(fa.failure_count)}</td></tr>
  </table></div>`;
  html += caveatsCard(d.caveats);
  return html;
}
function renderValidation(d){
  let html = `<div class="card"><h2>Validation gates · overall ${badge(d.overall_status)}</h2>
    <div class="kv">${esc(d.scope||'')}</div>
    <table><tr><th>gate</th><th>status</th><th>blocking</th><th>caveats</th></tr>`;
  d.gates.forEach(g=>{ html += `<tr><td>${esc(g.gate_name)}</td><td>${badge(g.status)}</td><td>${g.blocking}</td>
    <td>${(g.caveats||[]).map(esc).join("<br>")}</td></tr>`; });
  html += `</table></div>`;
  return html;
}
function renderReadiness(d){
  let html = `<div class="card"><h2>Mentor readiness · ${badge(d.final_status)}</h2><div class="kv">${esc(d.scope||'')}</div>
    <table><tr><th>check</th><th>status</th><th>intent</th><th>tools</th><th>reason</th></tr>`;
  d.checks.forEach(c=>{ html += `<tr><td>${esc(c.name)}</td><td>${badge(c.status)}</td><td>${esc(c.intent)}</td>
    <td>${(c.tool_calls||[]).map(t=>`<span class="tool">${esc(t)}</span>`).join("")}</td><td>${esc(c.reason)}</td></tr>`; });
  html += `</table></div>`;
  return html;
}
function renderBenchmark(d){
  let html = `<div class="card"><h2>QuestDB query benchmark · pgwire ${d.pgwire_live?'live':'off'}</h2>
    <div class="kv">recommendation: <b>${esc(d.recommendation_mode)}</b> · ${esc(d.note||'')}</div>
    <table><tr><th>query</th><th>path</th><th>p50 ms</th><th>p95 ms</th><th>min</th><th>max</th><th>exec ms</th></tr>`;
  for(const q in d.results){ ["rest","pgwire"].forEach(p=>{ const s=d.results[q][p]||{};
    if(s.error){ html += `<tr><td>${esc(q)}</td><td>${p}</td><td colspan="5">${esc(s.error)}</td></tr>`; }
    else { html += `<tr><td>${esc(q)}</td><td>${p}</td><td class="num">${s.p50}</td><td class="num">${s.p95}</td>
      <td class="num">${s.min}</td><td class="num">${s.max}</td><td class="num">${s.execute_mean}</td></tr>`; } }); }
  html += `</table></div>`;
  return html;
}
function renderTraceExamples(d){
  let html = `<div class="card"><h2>Pipeline trace examples</h2><div class="kv">${esc(d.note||'')}</div></div>`;
  d.examples.forEach(ex=>{ html += `<div class="card"><h2>${esc(ex.query)} · ${badge(ex.status)}</h2></div>` + renderTrace(ex.trace); });
  return html;
}
function renderNextActions(d){
  let html = `<div class="card"><h2>Next recommended actions · ${badge(d.current_status)}</h2>
    <div class="kv">warn areas: ${d.warn_areas}</div></div>`;
  d.next_actions.forEach(a=>{ html += `<div class="card">${nextActionInner(a)}</div>`; });
  return html;
}
function nextActionInner(a){
  return `<div class="next"><b>[${a.priority}] ${esc(a.title)}</b> ${badge(a.status)}<div class="kv">${esc(a.why)}</div>
    <code class="cmd">${esc(a.command)}</code><div class="kv">UI: ${esc(a.ui_path||'')}</div></div>`;
}
function table(rows){
  if(!rows.length) return "<div class='kv'>no rows</div>";
  const cols = Object.keys(rows[0]).slice(0, 9);
  let html = `<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`;
  rows.slice(0, 30).forEach(r=>{ html += `<tr>${cols.map(c=>{ const v=r[c]; const n=typeof v==="number";
    return `<td class="${n?'num':''}">${esc(n?fmt(v):v)}</td>`; }).join("")}</tr>`; });
  html += `</table>`;
  if(rows.length>30) html += `<div class="kv">+${rows.length-30} more rows…</div>`;
  return html;
}
function fmt(x){ if(x==null||x==="") return ""; const n=Number(x); return isNaN(n)?esc(x):n.toLocaleString(undefined,{maximumFractionDigits:2}); }
load();
</script>
