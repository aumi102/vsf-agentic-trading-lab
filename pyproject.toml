[project]
name = "vsf-trading-agent"
version = "0.1.0"
description = "QuestDB-backed trading agent: read-only FastAPI demo console, anti-blackbox pipeline trace, transparent backtest engine, and REST/PGWire query paths."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Core/runtime dependencies: the FastAPI demo console, the read-only agent + tools,
# the anti-blackbox trace, the simple backtest engine, and the REST/PGWire paths all
# run with just these.
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Research / heavier data + Backtrader comparison + ingestion helpers.
research = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=15",
    "backtrader>=1.9",
    "openpyxl>=3.1",
    "vnstock",
]
# Optional live DeepAgents (LLM) mode; the guarded demo routes do not need these.
deepagents = [
    "deepagents",
    "langchain",
    "langchain-openai",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/trading_agent/api/demo_console.html" = "trading_agent/api/demo_console.html"

[tool.uv]
# Keep the default resolver; extras are opt-in via `uv sync --extra research` etc.
package = true
